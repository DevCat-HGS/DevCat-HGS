[build]
  command = "npm run build"
  publish = "dist"

# Archivos con hash en el nombre: nunca cambian, se cachean un año.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imágenes: una semana, y se sirven viejas mientras se revalidan.
[[headers]]
  for = "/shots/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/credentials/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# El CV se regenera con cada commit: caché corta.
[[headers]]
  for = "/cv/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
