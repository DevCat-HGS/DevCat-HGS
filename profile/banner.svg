      .spin { transform-origin: 1000px 160px; animation: spin 40s linear infinite; }
      .spin-rev { transform-origin: 1000px 160px; animation: spin 70s linear infinite reverse; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { .spin, .spin-rev, .pulse { animation: none; } }
    </style>
  </defs>

