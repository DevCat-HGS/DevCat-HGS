  <text x="22" y="99" class="lang">Shell</text><rect x="118" y="91" width="200" height="9" rx="4.5" class="track"/><rect x="118" y="91" width="3" height="9" rx="4.5" fill="#89e051"/><text x="328" y="99" class="value">0.1%</text>
  <text x="452" y="36" class="title">Breadth of use</text>
