  <text x="452" y="99" class="lang">Shell</text><rect x="548" y="91" width="200" height="9" rx="4.5" class="track"/><rect x="548" y="91" width="100" height="9" rx="4.5" fill="#89e051"/><text x="758" y="99" class="value">1 repos</text>
