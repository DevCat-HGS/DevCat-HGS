name: Curriculum

on:
  push:
    branches: [main, portafolio]
    # Los PDF generados no vuelven a disparar el workflow.
    paths-ignore:
      - curriculum/output/**
      - portfolio/public/cv/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curriculum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: curriculum/requirements.txt

      - name: Install dependencies
        run: pip install -r curriculum/requirements.txt

      - name: Generate CV
        run: python curriculum/generate_cv.py

      # El PDF es determinista: si cv_data.json no cambió, no hay diff ni commit.
      - name: Commit CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curriculum/output
          [ -d portfolio/public/cv ] && git add portfolio/public/cv
          git diff --quiet --cached && echo "Sin cambios" && exit 0
          git commit -m "chore: update CV"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
