name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml
      - scripts/generate_language_charts.py

permissions:
  contents: write

jobs:
  language-charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # METRICS_TOKEN incluye los repositorios privados en el conteo.
      # Sin él, el script recurre al listado público y sigue funcionando.
      - name: Generate charts
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/generate_language_charts.py

      - name: Commit charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/languages.svg profile/languages.es.svg
          git diff --quiet --cached && echo "Sin cambios" && exit 0
          git commit -m "chore: update language charts"
          git push
